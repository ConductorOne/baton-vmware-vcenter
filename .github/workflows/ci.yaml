name: ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        if: success()
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go tests
        run: go test -v -covermode=count -json ./... > test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.5.1
        with:
          test-results: test.json

  test:
    runs-on: ubuntu-latest
    env:
      BATON_LOG_LEVEL: debug
      BATON_VCENTER_SERVER_URL: 'https://user:pass@127.0.0.1:8989/sdk'
      BATON_INSECURE: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start vcsim
        run: |
          go install github.com/vmware/govmomi/vcsim@v0.37.1
          nohup "$(go env GOPATH)/bin/vcsim" -l 127.0.0.1:8989 > vcsim.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sfk https://127.0.0.1:8989/about > /dev/null && exit 0
            sleep 1
          done
          cat vcsim.log
          exit 1
      - name: Build baton-vmware-vcenter
        run: go build ./cmd/baton-vmware-vcenter
      - name: Run baton-vmware-vcenter
        run: ./baton-vmware-vcenter
      - name: Install baton
        uses: ConductorOne/github-workflows/actions/get-baton@v4
      # vcsim's SSO search matches the connector's "*" literally, so no users or groups sync here.
      - name: Check roles were synced
        run: baton resources --resource-type=role --output-format=json | jq --exit-status '.resources | length > 0'
      - name: Check role grants were synced
        run: baton grants --entitlement="role:-1:member" --output-format=json | jq --exit-status '.grants | length > 0'
